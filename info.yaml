project:
  title:        "4-Core 8-bit SIMD Mini-GPU"
  author:       "Valdemar"
  discord:      ""
  description:  "4-core 8-bit SIMD GPU with 3x3 multiplier, 6x16-bit instruction RAM, and direct 4-bit RGBI video output."
  language:     "Verilog"
  clock_hz:     50000000

  # Måste matcha modulnamnet i src/project.v exakt!
  top_module:  "tt_um_my_mini_gpu"

  # 1x1 tile räcker gott för dina 15 000 µm²
  tiles: "1x1"

  # Källkodsfiler i src/
  source_files:
    - "project.v"

pinout:
  # Ingångar (ui_in[7:0])
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # Utgångar (uo_out[7:0])
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # Dubbelriktade pinnar (uio[7:0])
  uio[0]: "prog_mode[0]"
  uio[1]: "prog_write_en[1]"
  uio[2]: "start[2]"
  uio[3]: "done[3]"
  uio[4]: "vga_r[4]"
  uio[5]: "vga_g[5]"
  uio[6]: "vga_b[6]"
  uio[7]: "vga_i[7]"

yaml_version: 6
